name: Build PDF

on:
  push:
    branches: [main]
    paths:
      - "chapters/**"
      - "build/**"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-liberation fonts-dejavu

      - name: Build actualization.pdf
        run: |
          python3 build/prep.py > build/body.md
          pandoc build/front.md build/body.md -o actualization.pdf \
            --pdf-engine=xelatex --top-level-division=chapter -V block-headings

      - name: Commit the PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actualization.pdf
          git commit -m "Rebuild PDF" || echo "No changes"
          git push
